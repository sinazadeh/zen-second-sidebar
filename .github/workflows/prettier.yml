name: Prettier

on:
  push:
    branches: ["master"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["master"]
  schedule:
    - cron: "31 23 * * 5"

jobs:
  prettier:
    name: Run prettier in dry mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check formatting
        uses: creyD/prettier_action@v4.6
        with:
          dry: True
          # Keep in sync with the local setup command in AGENTS.md so local
          # and CI formatting never disagree.
          prettier_version: 3.9.9
          prettier_options: --write **/*.{js,mjs,md,yml,json}
