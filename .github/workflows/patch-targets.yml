# Runs this addon's Firefox source patches (src/second_sidebar/patchers/)
# against current Firefox sources every week, so a Firefox change that
# breaks one is caught before Zen ships it. A red run for "main" or "beta"
# is an early warning; a red run for "release" likely affects users now.
# See scripts/check_patch_targets.mjs.

name: Patch targets

on:
  schedule:
    # Every Wednesday at 07:00 UTC
    - cron: "0 7 * * 3"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "src/second_sidebar/patchers/**"
      - "scripts/check_patch_targets.mjs"
      - ".github/workflows/patch-targets.yml"

jobs:
  check:
    name: Firefox ${{ matrix.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: [release, beta, main]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check patch targets
        run: node scripts/check_patch_targets.mjs "${{ matrix.branch }}"
